<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Apartment 9 Tracker v6</title>
<style>
:root{--red:#e12525;--text:#f4f0e8;--muted:#a9a39a;--shadow:0 12px 30px rgba(0,0,0,.46)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,rgba(160,0,0,.14),transparent 34%),linear-gradient(135deg,#050505,#111 55%,#070707);color:var(--text);font-family:Tahoma,"Noto Sans Thai",system-ui,sans-serif}
button,select{font:inherit;color:inherit}.hidden{display:none!important}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(7,7,7,.95);border-bottom:2px solid #2c2c2c;position:sticky;top:0;z-index:30}
.logo{font-size:clamp(20px,3vw,31px);font-weight:1000}.logo b{color:var(--red)}.sub{font-size:11px;color:var(--muted)}.ta{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid #454545;background:#171717;border-radius:9px;padding:7px 10px;font-weight:900;cursor:pointer}.btn.primary{background:#8b1111;border-color:#e04a4a}.btn.gold{background:#4a3509;border-color:#987016}.btn.danger{background:#250b0b;border-color:#711b1b}.btn.turn{background:#17331d;border-color:#3d8a4a}
.screen{padding:18px;max-width:1680px;margin:auto}
.hero{padding:18px;border:2px solid #454545;border-left:5px solid var(--red);border-radius:15px;background:linear-gradient(135deg,#1b1b1b,#090909);box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,50px)}.hero p{margin:0;color:#c7c0b7}
.cat{margin:18px 0 25px}.ch{display:flex;gap:9px;align-items:center;margin-bottom:9px}.ci{width:36px;height:36px;display:grid;place-items:center;border:1px solid #444;border-radius:9px;background:#151515}.ch h2{margin:0;font-size:24px}.ch small{color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pick{border:2px solid #373737;border-radius:14px;overflow:hidden;background:#101010;cursor:pointer;position:relative;transition:.15s;box-shadow:0 8px 18px rgba(0,0,0,.25)}.pick:hover{transform:translateY(-2px);border-color:#666}.pick.selected{border-color:var(--accent)}.pick.selected:after{content:"✓";position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:1000}
.thumb{height:145px;background:center/cover no-repeat;position:relative;border-bottom:1px solid #333}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.86),transparent 58%)}.nb{position:absolute;left:10px;right:10px;bottom:8px;z-index:2}.nb h3{margin:0;font-size:21px}.nb div{font-size:11px;color:#ddd}
.pb{padding:9px 11px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;font-weight:900}.mini span{padding:5px 7px;border:1px solid #303030;border-radius:7px;background:#0b0b0b}
.lf{position:sticky;bottom:0;margin:18px -18px -18px;padding:11px 18px;background:linear-gradient(180deg,rgba(8,8,8,.7),rgba(8,8,8,.98) 32%);display:flex;gap:8px;align-items:center;z-index:15;flex-wrap:wrap}.lf .primary{margin-left:auto;padding:10px 18px;font-size:16px}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;padding:9px;border:1px solid #373737;border-radius:11px;background:#0c0c0c}.floor{display:flex;align-items:center;gap:6px;font-weight:900}.floor select{background:#151515;border:1px solid #444;border-radius:8px;padding:7px 9px}.phase{padding:7px 9px;border:1px solid #444;border-radius:8px;color:#aaa;font-weight:1000}.phase.on{background:#332900;border-color:#9b7d12;color:#ffda60}.turnno{padding:7px 9px;border:1px solid #35513b;border-radius:8px;color:#9ce8aa;background:#0d1d11;font-weight:1000}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(315px,1fr));gap:12px}
.player{border:2px solid #3d3d3d;border-radius:13px;background:linear-gradient(160deg,#151515,#090909);overflow:hidden;box-shadow:var(--shadow);position:relative}.player:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.phero{height:88px;background:center/cover no-repeat;position:relative;border-bottom:1px solid #333}.phero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.1),rgba(0,0,0,.87))}.pt{position:absolute;right:12px;bottom:9px;text-align:right;z-index:2}.pn{font-size:24px;font-weight:1000}.pr{font-size:11px;color:#ccc}
.stats{padding:10px 12px 4px 16px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{border:1px solid #373737;border-radius:9px;background:#0f0f0f;padding:8px}.sh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;font-weight:1000}.val{font-size:20px;font-weight:1000;min-width:40px;text-align:center;padding:2px 6px;border:1px solid #333;background:#050505;border-radius:7px}
.hp .val{color:#ff5a5a}.en .val{color:#ffd04a}.def .val{color:#6ac6ff}.dmg .val{color:#ff9b3d}.inf .val{color:#79dd85}.shield .val{color:#d8d8ff}
.seg{display:flex;gap:3px;margin-top:7px;height:9px}.seg i{display:block;flex:1;border:1px solid #444;border-radius:3px;background:#1b1b1b}.seg.hp i.on{background:#c82929;border-color:#ff6565}.seg.en i.on{background:#c99b19;border-color:#ffe16a}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.ctrl button{padding:4px 6px;border-radius:7px;border:1px solid #444;background:#161616;font-size:15px;font-weight:1000;cursor:pointer;min-height:30px}.ctrl .minus{background:#210c0c;border-color:#672020}.ctrl .plus{background:#0d2013;border-color:#225c35}.ctrl button:disabled{opacity:.28;cursor:not-allowed}
.skills{padding:7px 12px 12px 16px;display:grid;gap:7px}.skill{border:1px solid #393939;border-left:4px solid var(--sc,#d3ad27);border-radius:9px;background:#0f0f0f;padding:8px}.skill h4{margin:0 0 4px;font-size:14px}.skill p{margin:0;color:#d3cec5;font-size:12px;line-height:1.4}.skill button{margin-top:6px;padding:5px 8px;border:1px solid #444;border-radius:7px;background:#171717;font-size:12px;font-weight:900;cursor:pointer}
.skill.passive{--sc:#d5aa1c}.skill.p2{--sc:#8c48df}.skill.unlock{--sc:#14b8b1}.choice-wrap{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{border:1px dashed #65507d;border-radius:9px;padding:8px;background:#0c0a0f}.choice h4{margin:0 0 4px;font-size:13px}.choice p{margin:0;color:#cfc6d6;font-size:11px;line-height:1.35}.choice button{margin-top:6px;width:100%;padding:5px;border:1px solid #604c77;border-radius:7px;background:#1b1322;font-size:11px;font-weight:900;cursor:pointer}
.locked{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed #266762;background:#0b1413;border-radius:9px;padding:8px}.locked span{font-size:12px;color:#a8d5d2}.locked button{padding:5px 8px;border:1px solid #2f8a82;background:#0f2523;border-radius:7px;font-size:11px;font-weight:900;cursor:pointer}
.tempnote{margin-top:6px;font-size:10px;color:#e7d48f}
.log{margin-top:14px;border:1px solid #373737;border-radius:11px;background:#0b0b0b;padding:10px}.log h3{margin:0 0 6px;font-size:16px}.loglist{max-height:150px;overflow:auto;color:#c6beb4;font-size:12px}.li{padding:5px 0;border-top:1px solid #222}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:grid;place-items:center;padding:18px}.mc{width:min(570px,100%);background:#111;border:2px solid #474747;border-radius:14px;padding:16px;box-shadow:var(--shadow)}.mc h3{margin:0 0 7px;font-size:23px}.mc p{margin:6px 0;color:#c8c1b7;line-height:1.45}.dicegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}.dice{aspect-ratio:1;border:1px solid #555;border-radius:9px;background:#171717;font-size:22px;font-weight:1000;cursor:pointer}.ma{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(25px);opacity:0;background:#111;border:1px solid #555;border-left:4px solid var(--red);border-radius:9px;padding:9px 13px;z-index:80;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:720px){.screen{padding:10px}.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:120px}.nb h3{font-size:17px}.lf{margin:14px -10px -10px;padding:10px}.players{grid-template-columns:1fr}.choice-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div><div class="logo">APARTMENT <b>9</b></div><div class="sub">Character Tracker v6</div></div><div class="ta"><button class="btn" id="undo">↶ Undo</button><button class="btn gold" id="fs">⛶</button><button class="btn danger" id="reset">รีเซ็ต</button></div></header>

<main id="lobby" class="screen">
<section class="hero"><h1>LOBBY</h1><p>เลือกผู้รอดชีวิตตามหมวด แล้วกดเริ่มเกม</p></section>
<div id="groups"></div>
<div class="lf"><b>เลือกแล้ว <span id="cnt">0</span> คน</b><button class="btn" id="all">เลือกทั้งหมด</button><button class="btn primary" id="start">เริ่มเกม ▶</button></div>
</main>

<main id="game" class="screen hidden">
<div class="toolbar">
<button class="btn" id="back">← Lobby</button>
<div class="floor">ชั้น <select id="floorSel"><option>9</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
<button class="btn" id="nextFloor">ชั้นถัดไป ↓</button>
<div id="phase" class="phase">Phase 1</div>
<div id="turnNo" class="turnno">เทิร์น 1</div>
<button class="btn turn" id="endTurn">✓ จบเทิร์น</button>
<button class="btn primary" id="rest">🌙 พักผ่อน</button>
</div>
<section id="players" class="players"></section>
<section class="log"><h3>บันทึก</h3><div id="loglist" class="loglist"></div></section>
</main>

<div id="restM" class="modal hidden"><div class="mc"><h3>🌙 พักผ่อน</h3><p><b>พัก +1 EN</b><br>1 = ฝันร้าย (-1)<br>2–5 = ฝันดี (+1)<br>6 = ฝันดีมาก (+2)</p><div class="dicegrid"><button class="dice" data-r="1">1</button><button class="dice" data-r="2">2</button><button class="dice" data-r="3">3</button><button class="dice" data-r="4">4</button><button class="dice" data-r="5">5</button><button class="dice" data-r="6">6</button></div><div class="ma"><button class="btn" id="cancelRest">ยกเลิก</button></div></div></div>
<div id="confirmM" class="modal hidden"><div class="mc"><h3 id="confirmTitle">ยืนยัน</h3><p id="confirmText"></p><div class="ma"><button class="btn" id="confirmNo">ไม่</button><button class="btn primary" id="confirmYes">ใช่</button></div></div></div>
<div id="infoM" class="modal hidden"><div class="mc"><h3 id="it">ผลสกิล</h3><p id="ix"></p><div class="ma"><button class="btn primary" id="ic">ตกลง</button></div></div></div>
<div id="resetM" class="modal hidden"><div class="mc"><h3>รีเซ็ตเกม?</h3><p>ค่าทั้งหมดจะกลับไปเริ่มใหม่</p><div class="ma"><button class="btn" id="rn">ยกเลิก</button><button class="btn danger" id="ry">รีเซ็ต</button></div></div></div>
<div id="toast" class="toast"></div>

let state=(()=>{
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s)return fresh();
    const f=fresh();
    return {
      ...f,...s,
      values:{...f.values,...(s.values||{})},
      choices:{...f.choices,...(s.choices||{})},
      unlocked:{...f.unlocked,...(s.unlocked||{})},
      once:{...f.once,...(s.once||{})},
      flags:{...f.flags,...(s.flags||{})},
      tempTurn:{...f.tempTurn,...(s.tempTurn||{})}
    };
  }catch{return fresh()}
})();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function snap(){hist.push(JSON.stringify(state));hist=hist.slice(-40);localStorage.setItem(HIST,JSON.stringify(hist))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1300)}
function info(t,x){it.textContent=t;ix.textContent=x;infoM.classList.remove("hidden")}
function log(t){state.log.unshift(new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" — "+t);state.log=state.log.slice(0,40);save();renderLog()}
const sel=()=>chars.filter(c=>state.selected.includes(c.id));
const cv=id=>chars.find(c=>c.id===id);
const v=id=>state.values[id];

function cap(id,key,n){
  const c=cv(id),max=key==="hp"?c.hp:c.en;
  state.values[id][key]=Math.max(0,Math.min(max,n));
}
function spend(id,n,key="en"){
  if((v(id)[key]||0)<n){toast(key==="shield"?"โล่/เกราะไม่พอ":key==="hp"?"HP ไม่พอ":"พลังงานไม่พอ");return false}
  v(id)[key]-=n;return true;
}
function addTemp(id,key,n){
  v(id)[key]+=n;
  if(!state.tempTurn[id])state.tempTurn[id]={dmg:0,crit:0,def:0};
  state.tempTurn[id][key]=(state.tempTurn[id][key]||0)+n;
}
function addTempTeam(key,n){sel().forEach(c=>addTemp(c.id,key,n))}
function teamBuff(key,n){sel().forEach(c=>v(c.id)[key]+=n)}

function renderLobby(){
const gs=[["tank","🛡️","แท็งค์","รับแรงปะทะ / สร้างเกราะ"],["damage","⚔️","ดาเมจ","Burst / Crit / ทำดาเมจ"],["support","✚","ซัพพอร์ต","ฮีล / บัฟ / ค้นหา / Utility"]];
groups.innerHTML=gs.map(g=>`<section class="cat"><div class="ch"><div class="ci">${g[1]}</div><div><h2>${g[2]}</h2><small>${g[3]}</small></div></div><div class="roster">${chars.filter(c=>c.category===g[0]).map(c=>`<article class="pick ${state.selected.includes(c.id)?"selected":""}" data-id="${c.id}" style="--accent:${c.accent}"><div class="thumb" style="background-image:url('${c.thumb}')"><div class="nb"><h3>${c.name}</h3><div>${c.role}</div></div></div><div class="pb"><div class="mini"><span>❤️ ${c.hp}</span><span>⚡ ${c.en}</span><span>⚔️ ${c.atk}</span><span>🛡️ ${c.def}</span></div></div></article>`).join("")}</div></section>`).join("");
document.querySelectorAll(".pick").forEach(x=>x.onclick=()=>{const id=x.dataset.id;state.selected=state.selected.includes(id)?state.selected.filter(a=>a!==id):[...state.selected,id];save();renderLobby()});
cnt.textContent=state.selected.length;
}
function segments(cur,max,cls){return `<div class="seg ${cls}">${Array.from({length:max},(_,i)=>`<i class="${i<cur?"on":""}"></i>`).join("")}</div>`}
function stat(c,key,label,cls,limited=false){
 const val=v(c.id)[key],max=key==="hp"?c.hp:key==="en"?c.en:null;
 return `<div class="stat ${cls}"><div class="sh"><span>${label}</span><span class="val" id="${c.id}-${key}">${val}</span></div>${limited?segments(val,max,cls):""}<div class="ctrl"><button class="minus" onclick="chg('${c.id}','${key}',-1)">−</button><button class="plus" onclick="chg('${c.id}','${key}',1)" ${limited&&val>=max?"disabled":""}>＋</button></div></div>`;
}
function skillCard(c,type,text,label){
 const t=state.tempTurn[c.id]||{};
 const notes=[];
 if(t.dmg)notes.push(`DMG ชั่วคราว +${t.dmg}`);
 if(t.crit)notes.push(`CRIT ชั่วคราว +${t.crit}`);
 if(t.def)notes.push(`DEF ชั่วคราว +${t.def}`);
 return `<div class="skill ${type==="unlock"?"unlock":type.startsWith("p")?"p2":"passive"}"><h4>${label}</h4><p>${text}</p><button onclick="useSkill('${c.id}','${type}')">ใช้สกิล</button>${notes.length?`<div class="tempnote">${notes.join(" • ")}</div>`:""}</div>`
}
function phaseHTML(c){
 if(!state.phase2)return `<div class="locked"><span>🔒 Phase 2 เปิดเมื่อถึงชั้น 5</span></div>`;
 const ch=state.choices[c.id];
 if(!ch)return `<div class="choice-wrap"><div class="choice"><h4>Phase 2 (1)</h4><p>${c.p2[0]}</p><button onclick="chooseP2('${c.id}','p21')">เลือกสกิลนี้</button></div><div class="choice"><h4>Phase 2 (2)</h4><p>${c.p2[1]}</p><button onclick="chooseP2('${c.id}','p22')">เลือกสกิลนี้</button></div></div>`;
 let h=skillCard(c,ch,c.p2[ch==="p21"?0:1],ch==="p21"?"Phase 2 (1)":"Phase 2 (2)");
 h+=state.unlocked[c.id]?skillCard(c,"unlock",c.unlock,"สกิลไอเทมปลดล็อก"):`<div class="locked"><span>🔒 สกิลไอเทมปลดล็อก</span><button onclick="askUnlock('${c.id}')">ปลดล็อก</button></div>`;
 return h;
}
function renderPlayers(){
 players.innerHTML=sel().map(c=>`<article class="player" style="--accent:${c.accent}"><div class="phero" style="background-image:url('${c.thumb}')"><div class="pt"><div class="pn">${c.name}</div><div class="pr">${c.role} • ATK ${c.atk} • BAG ${c.bag}</div></div></div><div class="stats">${stat(c,"hp","❤️ เลือด","hp",true)}${stat(c,"en","⚡ พลังงาน","en",true)}${stat(c,"shield","🛡️ โล่/เกราะ","shield")}${stat(c,"def","🧱 DEF","def")}${stat(c,"dmg","💥 DMG","dmg")}${stat(c,"inf","☣️ ติดเชื้อ","inf")}${stat(c,"crit","🎯 CRIT","")}</div><div class="skills">${skillCard(c,"passive",c.passive,"Passive")}${phaseHTML(c)}</div></article>`).join("");
}
function renderPhase(){floorSel.value=String(state.floor);phase.textContent=state.phase2?"Phase 2":"Phase 1";phase.classList.toggle("on",state.phase2);turnNo.textContent=`เทิร์น ${state.turn}`}
function renderLog(){loglist.innerHTML=state.log.length?state.log.map(x=>`<div class="li">${x}</div>`).join(""):`<span style="color:#777">ยังไม่มีเหตุการณ์</span>`}
function show(){const g=state.screen==="game";lobby.classList.toggle("hidden",g);game.classList.toggle("hidden",!g);if(g){renderPhase();renderPlayers();renderLog()}else renderLobby()}
window.chg=function(id,key,d){snap();if(key==="hp"||key==="en")cap(id,key,v(id)[key]+d);else v(id)[key]=Math.max(0,(v(id)[key]||0)+d);save();renderPlayers()};

function endCurrentTurn(){
  snap();
  let removed=0;
  for(const c of sel()){
    const t=state.tempTurn[c.id]||{dmg:0,crit:0,def:0};
    for(const key of ["dmg","crit","def"]){
      const n=t[key]||0;
      if(n){v(c.id)[key]=Math.max(0,v(c.id)[key]-n);removed+=n;t[key]=0}
    }
  }
  state.turn=(state.turn||1)+1;
  save();renderPhase();renderPlayers();
  log(`จบเทิร์น ${state.turn-1}: รีเซ็ตบัฟชั่วคราว${removed?` ${removed} หน่วย`:""}`);
  toast("จบเทิร์น — บัฟชั่วคราวถูกรีเซ็ต");
}

function doRest(r){
 snap();
 let extra=r===1?-1:r===6?2:1;
 sel().forEach(c=>cap(c.id,"en",v(c.id).en+1+extra));
 if(state.selected.includes("goon")){cap("goon","en",v("goon").en+1);cap("goon","hp",v("goon").hp+1);v("goon").def+=1}
 if(state.selected.includes("guaytiew"))sel().forEach(c=>cap(c.id,"en",v(c.id).en+1));
 if(state.flags.sigmaFullRest&&state.selected.includes("sigma")){sel().filter(c=>c.id!=="sigma").forEach(c=>cap(c.id,"en",c.en));state.flags.sigmaFullRest=false}
 state.once.gt=false;state.once.bo=false;
 save();renderPlayers();
 const net=1+extra,label=r===1?"ฝันร้าย":r===6?"ฝันดีมาก":"ฝันดี";
 log(`พัก: ${label} • EN +${net} ก่อน Passive • เพิ่มซอมบี้ชั้นถัดไป +1`);
 info("พักผ่อน",`${label} — EN +${net}\nPassive ตอนพักทำงานอัตโนมัติ`);
}
function setFloor(n){state.floor=Math.max(1,Math.min(9,n));if(state.floor<=5)state.phase2=true;save();renderPhase();renderPlayers();if(state.floor===5)toast("ถึงชั้น 5 — Phase 2 เปิดแล้ว")}

start.onclick=()=>{if(!state.selected.length){toast("เลือกตัวละครก่อน");return}state.screen="game";save();show()};
back.onclick=()=>{state.screen="lobby";save();show()};
all.onclick=()=>{state.selected=state.selected.length===chars.length?[]:chars.map(c=>c.id);save();renderLobby()};
floorSel.onchange=e=>setFloor(Number(e.target.value));
nextFloor.onclick=()=>{if(state.floor<=1)toast("ถึงชั้นล่างสุดแล้ว");else setFloor(state.floor-1)};
endTurn.onclick=endCurrentTurn;
rest.onclick=()=>restM.classList.remove("hidden");
cancelRest.onclick=()=>restM.classList.add("hidden");
document.querySelectorAll(".dice").forEach(b=>b.onclick=()=>{restM.classList.add("hidden");doRest(Number(b.dataset.r))});
confirmNo.onclick=()=>{confirmAction=null;confirmM.classList.add("hidden")};
confirmYes.onclick=()=>{const fn=confirmAction;confirmAction=null;confirmM.classList.add("hidden");if(fn)fn()};
ic.onclick=()=>infoM.classList.add("hidden");
reset.onclick=()=>resetM.classList.remove("hidden");
rn.onclick=()=>resetM.classList.add("hidden");
ry.onclick=()=>{hist=[];localStorage.removeItem(HIST);state=fresh();save();resetM.classList.add("hidden");show();toast("รีเซ็ตแล้ว")};
undo.onclick=()=>{if(!hist.length){toast("ไม่มีรายการให้ย้อน");return}state=JSON.parse(hist.pop());localStorage.setItem(HIST,JSON.stringify(hist));save();show();toast("ย้อนแล้ว")};
fs.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};
renderLobby();show();
</script>
</body>
</html>
